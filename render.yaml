services:
  - type: web
    name: goofy-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GAME_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
