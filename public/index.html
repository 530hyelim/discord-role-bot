<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goofy Bot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: linear-gradient(165deg, #0f0f1a 0%, #1a1a2e 40%, #16213e 100%); font-family: 'Outfit', sans-serif; color: #e8e8e8; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        h1 span { font-size: 1.75rem; font-weight: 700; background: linear-gradient(90deg, #ffd93d, #ff9a3d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .sub { font-size: 0.9rem; color: #888; margin-top: 8px; margin-bottom: 30px; }
        .menu { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 320px; }
        .menu a { display: block; padding: 20px 24px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #e8e8e8; text-decoration: none; font-size: 1.1rem; font-weight: 600; transition: background 0.2s, transform 0.1s; }
        .menu a:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .menu a .desc { font-size: 0.85rem; font-weight: 400; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>🎮<span> GOOFY GAMES</span></h1>
    <p class="sub">디스코드 활동에서 획득한 포인트로 게임을 진행하고 보상을 받으세요</p>
    <nav class="menu" id="game-menu"></nav>

    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var token = params.get('token');
            var q = token ? '?token=' + encodeURIComponent(token) : '';

            var GAME_MENU = [
                { id: 'coin', name: '💸 코인 캐처', path: '/game/coin', desc: '떨어지는 코인을 받아 포인트를 벌어보세요' },
                { id: 'stock', name: '📈 주식 시뮬레이터', path: '/game/stock', desc: '포인트로 주식 시뮬레이션을 해보세요' }
            ];

            var el = document.getElementById('game-menu');
            if (el) {
                el.innerHTML = GAME_MENU.map(function (item) {
                    return '<a href="' + item.path + q + '">' + item.name + '<p class="desc">' + item.desc + '</p></a>';
                }).join('');
            }
        })();
    </script>
</body>
</html>
